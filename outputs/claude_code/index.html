<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Single-player tic-tac-toe PWA with AI opponent">
  <meta name="theme-color" content="#6366f1">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%236366f1' width='180' height='180'/><text x='50%' y='50%' font-size='100' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'>X</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%236366f1' width='180' height='180'/><text x='50%' y='50%' font-size='100' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'>X</text></svg>">
  <link rel="stylesheet" href="/style.css">
  <title>Tic-Tac-Toe PWA</title>
</head>
<body>
  <div class="container">
    <header>
      <h1>Tic-Tac-Toe</h1>
      <p class="subtitle">You vs AI</p>
    </header>

    <main>
      <div class="difficulty-selector">
        <label for="difficulty">Difficulty:</label>
        <select id="difficulty">
          <option value="1">Easy</option>
          <option value="2">Medium</option>
          <option value="3">Hard</option>
        </select>
      </div>

      <div class="game-status">
        <p id="status">Your turn (X)</p>
      </div>

      <div class="board" id="board">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
      </div>

      <button id="newGame" class="new-game-btn">New Game</button>
    </main>

    <div id="resultModal" class="modal hidden">
      <div class="modal-content">
        <h2 id="resultTitle"></h2>
        <p id="resultMessage"></p>
        <button id="resultNewGame" class="result-btn">New Game</button>
      </div>
    </div>
  </div>

  <script type="module" src="/game.js"></script>
</body>
</html>
