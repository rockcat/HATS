# The whole system: the runner, and the services that talk to it.
#
#   docker compose up -d              everything
#   docker compose up -d runner       just the runner
#   docker compose logs -f companion
#
# The runner is not built here. It lives in its own repository and ships as
# an image — this file runs it. Until it is published to a registry, build it
# there once and the tag below finds it locally:
#
#   npm run runner:build     (docker build -t hats-runner:latest ../hats-runner)
#
# The services ARE built here, all from one image: they share a dependency
# tree and a source tree and differ only in which file they start.
#
# The build context is the parent directory because package.json depends on
# the shared libraries by relative path (file:../hats-runner/packages/*).
# Copying that layout into the image is what lets npm ci resolve them.

x-service: &service
  build:
    context: ..
    dockerfile: HATS/Dockerfile
    target: services
  image: hats-services:latest
  restart: unless-stopped
  env_file: [.env]
  volumes:
    - ./runtime_data:/workspace/HATS/runtime_data
  environment: &service-env
    NODE_ENV: production
    RUNTIME_DIR: /workspace/HATS/runtime_data
    # Service names, not localhost: inside a container localhost is the
    # container itself, and every one of these would reach nothing.
    TEAM_RUNNER_URL: http://runner:3001
    AGENT_LIBRARY_URL: http://agent-library:3010
    PROJECT_SERVER_URL: http://project-server:3020
    SPEECH_SERVICE_URL: http://speech-service:3050

services:
  # ── The runner ─────────────────────────────────────────────────────────────
  runner:
    image: ${HATS_RUNNER_IMAGE:-hats-runner:latest}
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./runtime_data:/app/runtime_data
    env_file: [.env]
    environment:
      NODE_ENV: production
      RUNTIME_DIR: /app/runtime_data
      # No terminal in a container. Without this the chat CLI reads EOF on
      # stdin and closes the process about a second after it starts, which
      # looks exactly like a crash rather than a design decision.
      HATS_HEADLESS: "1"
      AGENT_LIBRARY_URL: http://agent-library:3010
      PROJECT_SERVER_URL: http://project-server:3020
      SPEECH_SERVICE_URL: http://speech-service:3050
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/state"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── The services ───────────────────────────────────────────────────────────
  #
  # Each is optional. The runner falls back to local disk with no project
  # server and to its bundled agents.json with no library, so starting a
  # subset is a working system rather than a broken one.

  agent-library:
    <<: *service
    ports: ["3010:3010"]
    command: ["node", "--import", "tsx/esm", "apps/agent-library/src/main.ts"]

  project-server:
    <<: *service
    ports: ["3020:3020"]
    command: ["node", "--import", "tsx/esm", "apps/project-server/src/main.ts"]

  project-designer:
    <<: *service
    ports: ["3030:3030"]
    command: ["node", "--import", "tsx/esm", "apps/project-designer/src/main.ts"]

  embodiment-test:
    <<: *service
    ports: ["3040:3040"]
    command: ["node", "--import", "tsx/esm", "apps/embodiment-test/src/main.ts"]

  companion:
    <<: *service
    ports: ["3060:3060"]
    command: ["node", "--import", "tsx/esm", "apps/companion/src/main.ts"]

  project-view:
    <<: *service
    ports: ["3070:3070"]
    command: ["node", "--import", "tsx/esm", "apps/project-view/src/main.ts"]

  # The odd one out: it spawns a Piper HTTP server per voice, so it needs a
  # Python runtime the other six never touch. Same source, different stage.
  speech-service:
    <<: *service
    build:
      context: ..
      dockerfile: HATS/Dockerfile
      target: speech
    image: hats-speech:latest
    ports:
      - "3050:3050"
      # One Piper HTTP server per loaded voice model.
      - "5100-5120:5100-5120"
    environment:
      <<: *service-env
      PYTHON_BIN: python3
      PIPER_VOICES_DIR: /workspace/HATS/runtime_data/piper_voices
    command: ["node", "--import", "tsx/esm", "apps/speech-service/src/main.ts"]
