services:
  hats:
    build: .
    image: hats:latest
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      # The installation's data directory. Default is this repo's own, which
      # is right for a standalone runner; set HATS_DATA to share one with
      # the services rather than keeping two that silently diverge.
      - ${HATS_DATA:-./runtime_data}:/app/runtime_data
    env_file:
      # Docker injects these directly; no --env-file flag needed in CMD
      - .env
    environment:
      NODE_ENV: production
      RUNTIME_DIR: /app/runtime_data
      # localhost in .env means the container itself here, not your machine.
      # Overrides .env; set DOCKER_OLLAMA_BASE_URL to point somewhere else.
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      # Voices come from the Speech Service, not the runner — without it the
      # voice list is empty. Set DOCKER_SPEECH_SERVICE_URL to point elsewhere.
      SPEECH_SERVICE_URL: ${DOCKER_SPEECH_SERVICE_URL:-http://host.docker.internal:3050}
      # Optional: when these do not answer, the runner uses the local agents.json
      # and project folders instead.
      AGENT_LIBRARY_URL: ${DOCKER_AGENT_LIBRARY_URL:-http://host.docker.internal:3010}
      PROJECT_SERVER_URL: ${DOCKER_PROJECT_SERVER_URL:-http://host.docker.internal:3020}
    extra_hosts:
      # Docker Desktop provides host.docker.internal; plain Linux Docker needs this.
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Two things this had wrong. It ran curl, which node:22-slim does not
      # carry, so the check could not execute at all. And every /api/ route
      # requires authentication, so even once it ran it got a 401 and called
      # a perfectly healthy runner unhealthy.
      #
      # Any reply under 500 means alive: a 401 proves the HTTP server and the
      # auth layer are both up, which is a better liveness signal than a
      # static file would be. Only a 5xx or a refused connection is a failure.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/state').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
