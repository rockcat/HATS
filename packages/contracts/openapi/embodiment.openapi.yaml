openapi: 3.1.0
info:
  title: HATS Embodiment API
  version: 1.0.0
  description: |
    The contract between a running HATS team and anything that wants to talk to
    it — web sites, desktop apps, mobile clients, kiosk installations.

    "Embodiment" is the whole surface of an agent as a presence: its identity and
    hats, its live state, its conversation threads, its face (GLB avatar and
    background) and its voice (synthesised speech with viseme timings for lip
    sync). A client that speaks this API can give an agent a body without
    knowing anything about orchestration, MCP or the project store.

    ## Interaction model

    Messaging is asynchronous. `POST /agents/{agentId}/messages` accepts a
    message and returns immediately; the agent's reply arrives over the SSE
    stream at `/events` and is appended to the thread readable at
    `GET /agents/{agentId}/messages`. Clients that only want request/response
    can poll the thread, but the stream is the intended path.

    ## Authentication

    Every endpoint requires a credential — the Team Runner authenticates all of
    `/api/*`. Third-party clients should use a static API key, created in the
    dashboard's Users tab and sent as `X-API-Key`. Browser clients signed into
    the dashboard may instead present their session token as a Bearer token.

    An unauthenticated request is answered with 401 and
    `{"error": "Not authenticated"}`.
  license:
    name: SEE LICENSE IN LICENSE.txt
servers:
  - url: http://localhost:3001/api/embodiment/v1
    description: Team Runner, mounted alongside the operator dashboard

security:
  - ApiKeyAuth: []
  - BearerAuth: []

tags:
  - name: Presence
    description: Who is here and what are they doing
  - name: Conversation
    description: Talking to an agent
  - name: Body
    description: Face and voice
  - name: Meta
    description: Health, project context and this document
  - name: Devices
    description: What the client can do, and tools that run on it rather than the runner

paths:
  /health:
    get:
      tags: [Meta]
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: Runner is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  version: { type: string }
                  agentCount: { type: integer }
                  speechAvailable: { type: boolean }

  /openapi.yaml:
    get:
      tags: [Meta]
      summary: This document
      operationId: getOpenApi
      responses:
        '200':
          description: OpenAPI document
          content:
            application/yaml:
              schema: { type: string }

  /project:
    get:
      tags: [Meta]
      summary: The project this team is running
      operationId: getProjectInfo
      responses:
        '200':
          description: Project context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectInfo' }

  /agents:
    get:
      tags: [Presence]
      summary: List the embodied agents
      operationId: listAgents
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: '#/components/schemas/EmbodiedAgent' }

  /agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Presence]
      summary: Fetch one agent
      operationId: getAgent
      responses:
        '200':
          description: The agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbodiedAgent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/threads:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Conversation]
      summary: List the agent's conversation threads
      description: Maps thread key to message count. `general` is the default direct-chat thread.
      operationId: listThreads
      responses:
        '200':
          description: Threads
          content:
            application/json:
              schema:
                type: object
                properties:
                  threads:
                    type: object
                    additionalProperties: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/messages:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Conversation]
      summary: Read a conversation thread
      operationId: getMessages
      parameters:
        - name: thread
          in: query
          schema: { type: string, default: general }
        - name: limit
          in: query
          description: Return only the most recent N messages
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: since
          in: query
          description: Only messages with a timestamp strictly after this ISO-8601 instant
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Messages, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  thread: { type: string }
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Conversation]
      summary: Say something to an agent
      description: |
        Accepted immediately. The reply is delivered over `/events` as an
        `agent_message` event and appended to the thread.
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '202':
          description: Accepted for delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendMessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/tasks:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Conversation]
      summary: Assign durable work to an agent
      description: Unlike a message, a task is tracked to completion and appears in the runner's task list.
      operationId: assignTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string }
                context: { type: string }
      responses:
        '202':
          description: Task accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean, const: true }
                  agentId: { type: string }
                  taskId: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/speech:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Body]
      summary: Speak text in the agent's voice
      description: |
        Synthesises WAV audio using the agent's assigned voice. When lip-sync is
        available the response also carries viseme timings, so a client can drive
        a mouth without running Rhubarb itself.
      operationId: synthesiseSpeech
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 4000 }
                withVisemes:
                  type: boolean
                  default: false
                  description: When true the JSON response embeds base64 audio plus viseme cues instead of returning raw WAV.
      responses:
        '200':
          description: Synthesised speech
          content:
            audio/wav:
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: '#/components/schemas/SpeechResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: No TTS voice configured for this agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /agents/{agentId}/avatar:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Body]
      summary: Download the agent's 3D head
      operationId: getAvatar
      responses:
        '200':
          description: GLB model
          content:
            model/gltf-binary:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agentId}/background:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Body]
      summary: Download the agent's background image
      operationId: getBackground
      responses:
        '200':
          description: Image
          content:
            image/png:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /events:
    get:
      tags: [Presence]
      summary: Live event stream
      description: |
        A `text/event-stream` of everything the team does. Event `data` is a JSON
        object whose `type` field selects the payload:

        | type | meaning |
        | --- | --- |
        | `hello` | first frame — carries the current agent roster |
        | `agent_state` | an agent changed state or activity |
        | `agent_message` | an agent produced text in a thread |
        | `agent_speech` | an agent started speaking (audio URL + visemes) |
        | `project_update` | goal, name or team membership changed |
        | `heartbeat` | keep-alive, sent every 25s |

        Filter with `?agentId=` to receive only one agent's traffic.
      operationId: streamEvents
      parameters:
        - name: agentId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }

  /devices/{deviceId}:
    put:
      tags: [Devices]
      summary: Declare a device
      description: |
        Register what this client offers and what it can do for itself, and
        learn what the runner decided to do about it.

        **Tools** are things the agent calls that run here — a camera is the
        reason this exists, since the runner has no route to one. They are
        offered to the agent only while a device that declared them is
        connected, because a tool that cannot work is worse than an absent one.

        **Capabilities** are different: the runner never calls them, it reads
        them to decide how to do its own job. Two devices offering the same
        tools are not equivalent — a phone may be able to turn a face into a
        vector in milliseconds where a browser tab cannot.

        The response is half of a negotiation rather than an acknowledgement.
        It says where each piece of work will happen, so a client that *can*
        embed faces learns whether the runner wants it to, and with which
        model. That last part matters more than it looks: vectors from
        different models cannot be compared at all, so the runner's model is
        canonical and a device may embed only if it runs that exact one.

        Re-registering replaces the previous declaration rather than merging,
        so an app upgraded mid-session does not keep abilities it has lost.
      operationId: declareDevice
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceDeclaration' }
      responses:
        '200':
          description: Registered, with what was agreed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAgreement' }
        '400':
          description: No tool list
    delete:
      tags: [Devices]
      summary: Withdraw a device
      description: |
        Stop offering this device's tools. Anything it was asked and never
        answered is failed immediately rather than left to time out, so the
        agent learns sooner. A device is dropped automatically when its event
        stream closes, so this is for a clean exit.
      operationId: withdrawDevice
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: Withdrawn

  /devices:
    get:
      tags: [Devices]
      summary: List connected devices
      operationId: listDevices
      responses:
        '200':
          description: What is attached, what it offers and what was agreed
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { $ref: '#/components/schemas/ConnectedDevice' }

  /device-results/{requestId}:
    post:
      tags: [Devices]
      summary: Answer a device request
      description: |
        Post the result of a `device_request` that arrived on the event stream,
        against its id.

        Always answer, including on failure: a request left unanswered costs
        the agent the full timeout before it learns nothing. A late answer is
        not an error — it raced the timeout — so it is reported as
        `settled: false` rather than rejected.
      operationId: postDeviceResult
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceResult' }
      responses:
        '200':
          description: Whether anything was still waiting for it
          content:
            application/json:
              schema:
                type: object
                properties:
                  settled: { type: boolean }
        '400':
          description: Missing `ok`

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: A static API key created in the dashboard's Users tab.
    BearerAuth:
      type: http
      scheme: bearer
      description: A dashboard session token, for clients already signed in.

  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: A stable id this client chose for itself and reuses across reconnects.
      schema: { type: string }
    AgentId:
      name: agentId
      in: path
      required: true
      description: The agent's `instanceId`. The agent's name is also accepted for convenience.
      schema: { type: string }

  responses:
    NotFound:
      description: No such agent
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    EmbeddingModel:
      type: object
      description: |
        A model that turns a face into a vector. Vectors are comparable only
        within one model — the same face through two models gives two sets of
        numbers with no relationship — so it is always named alongside them.
      required: [model, dimensions]
      properties:
        model:
          type: string
          description: Stable id, compared exactly.
          example: mobilefacenet-v1
        dimensions:
          type: integer
          description: Length of the vector it produces.
          example: 192

    DeviceCapabilities:
      type: object
      description: |
        What a device can do for itself. Unknown keys are ignored rather than
        rejected, so a newer client still registers with an older runner.

        Claim only what works. The runner plans around these, so a capability
        claimed and not delivered is worse than one never claimed — it stops
        the runner doing the job itself.
      properties:
        faceEmbedding:
          type: array
          description: Models this device can run locally.
          items: { $ref: '#/components/schemas/EmbeddingModel' }
        camera:
          type: object
          properties:
            lenses:
              type: array
              items: { type: string, example: back }
        speech:
          type: object
          properties:
            recognition: { type: boolean }
            synthesis: { type: boolean }

    DeviceToolSpec:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          description: Bare name. The runner namespaces it with `device__`.
          example: take_photo
        description:
          type: string
          description: |
            What it is for, in terms the agent can act on. This is all the model
            has when deciding whether to call it.
        parameters:
          type: object
          description: JSON Schema for the arguments, or absent if it takes none.

    DeviceDeclaration:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items: { $ref: '#/components/schemas/DeviceToolSpec' }
        label:
          type: string
          description: Something recognisable in a log.
          example: Paul's phone
        capabilities: { $ref: '#/components/schemas/DeviceCapabilities' }

    DeviceAgreement:
      type: object
      description: Where each piece of work will happen, now that both ends have spoken.
      properties:
        deviceId: { type: string }
        tools:
          type: array
          items: { type: string }
        agreed:
          type: object
          properties:
            faceEmbedding:
              type: string
              enum: [device, runner, nowhere]
              description: |
                `device` — embed here and send a vector, which keeps the face on
                this device. `runner` — send the picture instead. `nowhere` —
                neither end can, so do not offer it to the agent.
            faceModel: { $ref: '#/components/schemas/EmbeddingModel' }

    ConnectedDevice:
      type: object
      properties:
        deviceId: { type: string }
        label: { type: string }
        tools:
          type: array
          items: { type: string }
        capabilities: { $ref: '#/components/schemas/DeviceCapabilities' }

    DeviceResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        result:
          type: string
          description: What the agent should read.
        error:
          type: string
          description: Why it failed, in terms the agent can act on.
        image:
          type: object
          description: |
            A picture the tool produced, for a model that can see. Dropped with
            an explanation if it is too large or in a format no model takes,
            rather than failing the whole request.
          properties:
            mediaType: { type: string, example: image/jpeg }
            base64: { type: string, description: The image, with no data: prefix. }

    HatType:
      type: string
      enum: [none, white, red, black, yellow, green, blue]

    AgentState:
      type: string
      enum: [idle, working, waiting, waiting_for_help, in_discussion]

    EmbodiedAgent:
      type: object
      required: [id, name, hats, state, activity, model, identity, threads]
      properties:
        id: { type: string, description: Deployed agent instanceId }
        templateId:
          type: string
          description: >
            The Agent Library template this instance was deployed from, when
            it came from one. A deployed agent is a copy rather than a
            reference, so this is provenance only.
        name: { type: string }
        hats: { type: array, items: { $ref: '#/components/schemas/HatType' } }
        state: { $ref: '#/components/schemas/AgentState' }
        activity: { type: string, description: Human-readable status line }
        talkingTo: { type: string }
        model:
          type: object
          properties:
            provider: { type: string }
            model: { type: string }
        identity:
          type: object
          properties:
            visualDescription: { type: string }
            specialisation: { type: string }
            backstory: { type: string }
            email: { type: string }
            avatar: { type: string }
            background: { type: string }
            voice: { type: string }
            speakerName: { type: string }
        threads:
          type: object
          additionalProperties: { type: integer }
        hourlyCost: { type: number }
        costIdled: { type: boolean }
        hasVoice: { type: boolean }
        hasAvatar: { type: boolean }
        appearance:
          allOf: [{ $ref: '#/components/schemas/AvatarFraming' }]
          description: >
            How to frame the model returned by `/agents/{agentId}/avatar`.
            Absent when the agent has no avatar, or none the runner can frame.

    AvatarFraming:
      type: object
      description: >
        Camera and model placement for the avatar. Without it a client can
        fetch the model but has no idea where to put the camera.
      properties:
        camera:
          type: array
          description: Camera position [x, y, z] in metres
          items: { type: number }
          minItems: 3
          maxItems: 3
        rotate:
          type: array
          description: Model rotation [x, y, z] in degrees
          items: { type: number }
          minItems: 3
          maxItems: 3
        fov: { type: number, description: Vertical field of view in degrees }
        scale: { type: number, description: Uniform scale applied to the model }

    Message:
      type: object
      required: [role, content, timestamp]
      properties:
        role: { type: string, enum: [user, assistant, tool] }
        content: { type: string }
        timestamp: { type: string, format: date-time }
        toolName: { type: string }

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 32000 }
        thread: { type: string, default: general }
        mode:
          type: string
          enum: [chat, task]
          default: chat
          description: '`task` routes through the orchestrator task pipeline instead of direct chat.'
        context: { type: string, description: Extra context, only used when mode is task }

    SendMessageResponse:
      type: object
      properties:
        accepted: { type: boolean, const: true }
        agentId: { type: string }
        thread: { type: string }
        messageId: { type: string }

    SpeechResult:
      type: object
      properties:
        audioBase64: { type: string, description: WAV bytes, base64 encoded }
        mimeType: { type: string, const: audio/wav }
        durationMs: { type: number }
        visemes:
          type: array
          items:
            type: object
            properties:
              start: { type: number, description: Seconds from the start of the clip }
              end: { type: number }
              viseme: { type: string, description: ARKit viseme name }

    ProjectInfo:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        goal: { type: string }
        humanName: { type: string }
        source:
          type: string
          enum: [project-server, local]
          description: Whether the definition came from the Project Server or from local disk.
        agentCount: { type: integer }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
