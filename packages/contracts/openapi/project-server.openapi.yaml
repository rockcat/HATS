openapi: 3.1.0
info:
  title: HATS Project Server API
  version: 1.0.0
  description: |
    Creation, selection and storage of project definitions. The Project Designer
    writes definitions here; the Team Runner reads the active definition on
    startup and writes back changes it makes at runtime (goal edits, renames,
    agents added or removed by the team itself).

    Definitions are described by `project.schema.json`, served live from
    `/api/v1/schemas/project`.
  license:
    name: SEE LICENSE IN LICENSE.txt
servers:
  - url: http://localhost:3020
    description: Local Project Server

tags:
  - name: Projects
    description: Project lifecycle and definitions
  - name: Team
    description: The deployed agents inside a project
  - name: Meta
    description: Health, schemas and this document

paths:
  /api/v1/health:
    get:
      tags: [Meta]
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  version: { type: string }
                  projectCount: { type: integer }
                  activeProjectId: { type: [string, 'null'] }

  /api/v1/schemas/{name}:
    get:
      tags: [Meta]
      summary: Fetch one JSON Schema document
      operationId: getSchema
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [common, agentTemplate, deployedAgent, project]
      responses:
        '200':
          description: The schema document
          content:
            application/schema+json:
              schema: { type: object }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/openapi.yaml:
    get:
      tags: [Meta]
      summary: This document
      operationId: getOpenApi
      responses:
        '200':
          description: OpenAPI document
          content:
            application/yaml:
              schema: { type: string }

  /api/v1/projects:
    get:
      tags: [Projects]
      summary: List projects
      operationId: listProjects
      responses:
        '200':
          description: Project summaries, most recently updated first
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectSummary' }
                  activeProjectId: { type: [string, 'null'] }
    post:
      tags: [Projects]
      summary: Create a project
      description: |
        `id` is optional — when omitted it is slugified from `name`. Creating a
        project also creates its folder (`sources/`, `outputs/`) under the
        projects root so the Team Runner has somewhere to work.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' }
                name: { type: string }
                description: { type: string }
                goal: { type: string }
                humanName: { type: string, default: Human }
                team:
                  type: array
                  items: { $ref: '#/components/schemas/DeployedAgent' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDefinition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: A project with that id already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Projects]
      summary: Fetch the full project definition
      operationId: getProject
      responses:
        '200':
          description: The definition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDefinition' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Projects]
      summary: Replace the project definition
      description: |
        Send the whole document. Supply `expectedRevision` to make the write
        conditional — the server rejects with 409 when the stored revision has
        moved on, which is how the Designer and the Runner avoid clobbering
        each other.
      operationId: replaceProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProjectDefinitionInput'
                - type: object
                  properties:
                    expectedRevision: { type: integer }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDefinition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
    patch:
      tags: [Projects]
      summary: Update selected project fields
      operationId: patchProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                goal: { type: string }
                humanName: { type: string }
                settings: { $ref: '#/components/schemas/ProjectSettings' }
                mcpServers:
                  type: array
                  items: { $ref: '#/components/schemas/McpServerDefinition' }
                expectedRevision: { type: integer }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDefinition' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
    delete:
      tags: [Projects]
      summary: Delete a project definition
      description: Removes the definition. Pass `purge=true` to also delete the project's runtime folder.
      operationId: deleteProject
      parameters:
        - name: purge
          in: query
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{id}/team:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Team]
      summary: List the deployed agents in a project
      operationId: listTeam
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    type: array
                    items: { $ref: '#/components/schemas/DeployedAgent' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Team]
      summary: Deploy an agent into the project
      description: |
        Supply `templateId` to deploy a template resolved from the Agent Library,
        or `agent` to add a fully specified deployed agent authored in place.
      operationId: deployAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId: { type: string, format: uuid }
                name: { type: string, description: Project-local name override }
                projectRole: { type: string }
                agent: { $ref: '#/components/schemas/DeployedAgent' }
      responses:
        '201':
          description: The deployed agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeployedAgent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: The Agent Library could not be reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/projects/{id}/team/{instanceId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: instanceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Team]
      summary: Edit one deployed agent
      operationId: patchDeployedAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeployedAgentPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeployedAgent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Team]
      summary: Remove an agent from the project
      operationId: removeDeployedAgent
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/active:
    get:
      tags: [Projects]
      summary: The project the Team Runner should load
      operationId: getActiveProject
      responses:
        '200':
          description: Active project
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeProjectId: { type: [string, 'null'] }
                  project:
                    oneOf:
                      - { $ref: '#/components/schemas/ProjectDefinition' }
                      - { type: 'null' }
    put:
      tags: [Projects]
      summary: Select the active project
      operationId: setActiveProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        '200':
          description: Selected
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeProjectId: { type: string }
                  project: { $ref: '#/components/schemas/ProjectDefinition' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  responses:
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: The document failed schema validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RevisionConflict:
      description: The stored revision has moved on since `expectedRevision`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    HatType:
      type: string
      enum: [none, white, red, black, yellow, green, blue]

    ProviderName:
      type: string
      enum: [anthropic, openai, gemini, ollama, lmstudio, external, mock]

    Identity:
      type: object
      required: [visualDescription]
      properties:
        visualDescription: { type: string }
        specialisation: { type: string }
        backstory: { type: string }
        email: { type: string, format: email }
        avatar: { type: string }
        background: { type: string }
        voice: { type: string }
        speakerName: { type: string }

    ModelBinding:
      type: object
      required: [provider, model]
      properties:
        provider: { $ref: '#/components/schemas/ProviderName' }
        model: { type: string }

    DeployedAgent:
      description: Canonical definition — see deployed-agent.schema.json
      type: object
      required: [schemaVersion, instanceId, name, hats, identity, model, enabled, deployedAt]
      properties:
        schemaVersion: { type: integer, const: 1 }
        instanceId: { type: string, format: uuid }
        templateId: { type: string, format: uuid }
        templateRevision: { type: integer }
        name: { type: string }
        hats: { type: array, items: { $ref: '#/components/schemas/HatType' }, minItems: 1 }
        identity: { $ref: '#/components/schemas/Identity' }
        model: { $ref: '#/components/schemas/ModelBinding' }
        limits:
          type: object
          properties:
            maxContextTokens: { type: integer }
            maxCostPerHour: { type: number }
        tools:
          type: object
          properties:
            enabledMcpServers: { type: array, items: { type: string } }
            disabledPersonalMcpServers: { type: array, items: { type: string } }
        scheduledActionIds: { type: array, items: { type: string } }
        enabled: { type: boolean }
        projectRole: { type: string }
        teamContext: { type: string }
        deployedAt: { type: string, format: date-time }

    DeployedAgentPatch:
      type: object
      properties:
        name: { type: string }
        hats: { type: array, items: { $ref: '#/components/schemas/HatType' } }
        identity: { $ref: '#/components/schemas/Identity' }
        model: { $ref: '#/components/schemas/ModelBinding' }
        enabled: { type: boolean }
        projectRole: { type: string }
        limits:
          type: object
          properties:
            maxContextTokens: { type: integer }
            maxCostPerHour: { type: number }
        tools:
          type: object
          properties:
            enabledMcpServers: { type: array, items: { type: string } }
        scheduledActionIds: { type: array, items: { type: string } }

    McpServerDefinition:
      type: object
      required: [name, config]
      properties:
        name: { type: string }
        config:
          type: object
          required: [transport]
          properties:
            transport: { type: string, enum: [stdio, http, sse] }
            command: { type: string }
            args: { type: array, items: { type: string } }
            env: { type: object, additionalProperties: { type: string } }
            url: { type: string }
            headers: { type: object, additionalProperties: { type: string } }

    ProjectSettings:
      type: object
      properties:
        speechEnabled: { type: boolean }
        autoAssignVisuals: { type: boolean }
        defaultMeetingType:
          type: string
          enum: [standup, sprint_planning, retro, review, ad_hoc]

    ProjectDefinition:
      description: Canonical definition — see project.schema.json
      type: object
      required: [schemaVersion, id, name, humanName, team, revision, createdAt, updatedAt]
      properties:
        schemaVersion: { type: integer, const: 1 }
        id: { type: string }
        name: { type: string }
        description: { type: string }
        goal: { type: string }
        humanName: { type: string }
        team:
          type: array
          items: { $ref: '#/components/schemas/DeployedAgent' }
        mcpServers:
          type: array
          items: { $ref: '#/components/schemas/McpServerDefinition' }
        settings: { $ref: '#/components/schemas/ProjectSettings' }
        revision: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectDefinitionInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        goal: { type: string }
        humanName: { type: string }
        team:
          type: array
          items: { $ref: '#/components/schemas/DeployedAgent' }
        mcpServers:
          type: array
          items: { $ref: '#/components/schemas/McpServerDefinition' }
        settings: { $ref: '#/components/schemas/ProjectSettings' }

    ProjectSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        goal: { type: string }
        description: { type: string }
        teamSize: { type: integer }
        revision: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        active: { type: boolean }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
