openapi: 3.1.0
info:
  title: HATS Agent Library API
  version: 1.0.0
  description: |
    Management of reusable agent templates, independent of any project or team
    deployment. The Project Designer reads templates from here; the Team Runner
    never writes to it.

    Templates are described by `agent-template.schema.json`, served live from
    `/api/v1/schemas/agentTemplate`.
  license:
    name: SEE LICENSE IN LICENSE.txt
servers:
  - url: http://localhost:3010
    description: Local Agent Library service

tags:
  - name: Templates
    description: CRUD over the agent library
  - name: Catalogue
    description: Read-only reference data used when authoring a template
  - name: Meta
    description: Health, schemas and this document

paths:
  /api/v1/health:
    get:
      tags: [Meta]
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /api/v1/schemas:
    get:
      tags: [Meta]
      summary: List the JSON Schemas this service validates against
      operationId: listSchemas
      responses:
        '200':
          description: Schema names
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas: { type: array, items: { type: string } }

  /api/v1/schemas/{name}:
    get:
      tags: [Meta]
      summary: Fetch one JSON Schema document
      operationId: getSchema
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [common, agentTemplate, deployedAgent, project]
      responses:
        '200':
          description: The schema document
          content:
            application/schema+json:
              schema: { type: object }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/openapi.yaml:
    get:
      tags: [Meta]
      summary: This document
      operationId: getOpenApi
      responses:
        '200':
          description: OpenAPI document
          content:
            application/yaml:
              schema: { type: string }

  /api/v1/agent-templates:
    get:
      tags: [Templates]
      summary: List agent templates
      operationId: listAgentTemplates
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring match over name, description and specialisation
          schema: { type: string }
        - name: hat
          in: query
          description: Only templates wearing this hat
          schema: { $ref: '#/components/schemas/HatType' }
        - name: tag
          in: query
          description: Only templates carrying this tag
          schema: { type: string }
      responses:
        '200':
          description: Matching templates, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items: { $ref: '#/components/schemas/AgentTemplate' }
                  total: { type: integer }
    post:
      tags: [Templates]
      summary: Create an agent template
      operationId: createAgentTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentTemplateInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTemplate' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/agent-templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Templates]
      summary: Fetch one template
      operationId: getAgentTemplate
      responses:
        '200':
          description: The template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTemplate' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Templates]
      summary: Replace a template
      description: The body must be a complete, schema-valid template. `id`, `createdAt` and `revision` are managed by the server.
      operationId: replaceAgentTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentTemplateInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTemplate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Templates]
      summary: Partially update a template
      operationId: patchAgentTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentTemplateInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTemplate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Templates]
      summary: Delete a template
      description: Projects that already deployed this template are unaffected — deployed agents are fully resolved copies.
      operationId: deleteAgentTemplate
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/agent-templates/{id}/duplicate:
    post:
      tags: [Templates]
      summary: Copy a template under a new id
      operationId: duplicateAgentTemplate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: 'Name for the copy. Defaults to "<name> (copy)".' }
      responses:
        '201':
          description: The new template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTemplate' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/agent-templates/{id}/prompt-preview:
    get:
      tags: [Templates]
      summary: Render the system prompt this template would produce
      operationId: previewAgentTemplatePrompt
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The rendered prompt
          content:
            application/json:
              schema:
                type: object
                properties:
                  prompt: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/personas:
    get:
      tags: [Catalogue]
      summary: Persona seeds grouped by hat
      description: Ready-made names, visual descriptions and backstories used to bootstrap a template.
      operationId: listPersonas
      responses:
        '200':
          description: Personas by hat
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items: { $ref: '#/components/schemas/Persona' }

  /api/v1/hats:
    get:
      tags: [Catalogue]
      summary: The hat definitions and their directives
      operationId: listHats
      responses:
        '200':
          description: Hat definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  hats:
                    type: array
                    items: { $ref: '#/components/schemas/HatDefinition' }

  /api/v1/specialisations:
    get:
      tags: [Catalogue]
      summary: Specialisations that carry extra prompt directives
      operationId: listSpecialisations
      responses:
        '200':
          description: Specialisation names
          content:
            application/json:
              schema:
                type: object
                properties:
                  specialisations: { type: array, items: { type: string } }

  /api/v1/providers:
    get:
      tags: [Catalogue]
      summary: Known LLM providers and their models
      operationId: listProviders
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { $ref: '#/components/schemas/ProviderName' }
                        models: { type: array, items: { type: string } }

  /api/v1/avatars:
    get:
      tags: [Catalogue]
      summary: Avatar GLB catalogue
      operationId: listAvatars
      responses:
        '200':
          description: Avatars
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatars:
                    type: array
                    items:
                      type: object
                      properties:
                        file: { type: string }
                        name: { type: string }

components:
  responses:
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: The document failed schema validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Health:
      type: object
      properties:
        ok: { type: boolean }
        service: { type: string }
        version: { type: string }
        templateCount: { type: integer }

    HatType:
      type: string
      enum: [none, white, red, black, yellow, green, blue]

    ProviderName:
      type: string
      enum: [anthropic, openai, gemini, ollama, lmstudio, external, mock]

    Identity:
      type: object
      required: [visualDescription]
      properties:
        visualDescription: { type: string }
        specialisation: { type: string }
        backstory: { type: string }
        email: { type: string, format: email }
        avatar: { type: string }
        background: { type: string }
        voice: { type: string }
        speakerName: { type: string }

    ModelBinding:
      type: object
      required: [provider, model]
      properties:
        provider: { $ref: '#/components/schemas/ProviderName' }
        model: { type: string }

    Limits:
      type: object
      properties:
        maxContextTokens: { type: integer, minimum: 1000 }
        maxCostPerHour: { type: number, exclusiveMinimum: 0 }

    ToolAccess:
      type: object
      properties:
        enabledMcpServers: { type: array, items: { type: string } }
        disabledPersonalMcpServers: { type: array, items: { type: string } }

    AgentTemplate:
      description: Canonical definition — see agent-template.schema.json
      type: object
      required: [schemaVersion, id, name, hats, identity, model, revision, createdAt, updatedAt]
      properties:
        schemaVersion: { type: integer, const: 1 }
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        hats: { type: array, items: { $ref: '#/components/schemas/HatType' }, minItems: 1 }
        identity: { $ref: '#/components/schemas/Identity' }
        model: { $ref: '#/components/schemas/ModelBinding' }
        limits: { $ref: '#/components/schemas/Limits' }
        tools: { $ref: '#/components/schemas/ToolAccess' }
        scheduledActionIds: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AgentTemplateInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        hats: { type: array, items: { $ref: '#/components/schemas/HatType' } }
        identity: { $ref: '#/components/schemas/Identity' }
        model: { $ref: '#/components/schemas/ModelBinding' }
        limits: { $ref: '#/components/schemas/Limits' }
        tools: { $ref: '#/components/schemas/ToolAccess' }
        scheduledActionIds: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }

    Persona:
      type: object
      properties:
        name: { type: string }
        visualDescription: { type: string }
        specialisation: { type: string }
        backstory: { type: string }

    HatDefinition:
      type: object
      properties:
        type: { $ref: '#/components/schemas/HatType' }
        label: { type: string }
        coreTrait: { type: string }
        thinkingStyle: { type: string }
        communicationTone: { type: string }
        directives: { type: array, items: { type: string } }
        avoidances: { type: array, items: { type: string } }
        teamRole: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
