# Build the runner image and publish it to GitHub Container Registry.
#
#   ghcr.io/rockcat/hats-runner:latest     every push to main
#   ghcr.io/rockcat/hats-runner:0.1.3      a tag v0.1.3 (also :0.1)
#   ghcr.io/rockcat/hats-runner:sha-abc1234
#
# A new machine pulls these instead of building — see deploy/ in the
# HATS repository.

name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hats-runner
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # gl compiles ANGLE from source on Node 24; the cache saves that
          # half hour on every build that does not touch package*.json.
          cache-from: type=gha
          cache-to: type=gha,mode=max
