# Build the images and publish them to GitHub Container Registry.
#
#   ghcr.io/rockcat/hats/runner     the runner                   (Dockerfile)
#   ghcr.io/rockcat/hats/services   the Node services            (Dockerfile.services)
#   ghcr.io/rockcat/hats/speech     the Speech Service, with Python and Piper
#
# Tagged :latest on every push to main, :0.1.3 and :0.1 for a tag v0.1.3,
# and :sha-abc1234 always. They are public, so a new machine pulls them
# without signing in — see deploy/.
#
# Published with this workflow's own token, so each package is linked to this
# repository. (The hats-runner, hats-services and hats-speech packages were
# published from the repositories this one replaced, which is why these have
# new names.)

name: Docker images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      # The images are independent: one failing should not cancel the others.
      fail-fast: false
      matrix:
        include:
          - image: hats/runner
            file: Dockerfile
            target: runner
          - image: hats/services
            file: Dockerfile.services
            target: services
          - image: hats/speech
            file: Dockerfile.services
            target: speech
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
