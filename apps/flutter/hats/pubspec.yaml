name: hats
description: HATS mobile team client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  flutter_secure_storage: ^10.3.1
  mobile_scanner: ^5.2.0
  speech_to_text: ^7.4.0
  model_viewer_plus: ^1.8.0
  provider: ^6.1.2
  permission_handler: ^11.3.1
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  webview_flutter: ^4.0.0
  webview_flutter_android: ^3.0.0
  # The avatar renderer, shared with apps/poppyinyourpocket.
  hats_avatar_view:
    path: ../avatar_view

flutter:
  uses-material-design: true
