<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Wren visits Insights for the pricing-page figures</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#ffffff"/>

  <!-- Project Server -->
  <rect x="330" y="24" width="300" height="84" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="480" y="56" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">Project Server</text>
  <text x="480" y="80" text-anchor="middle" font-size="13" fill="#57606a">checks both teams agree, holds the visit</text>
  <text x="480" y="97" text-anchor="middle" font-size="13" fill="#57606a">and the travel pack</text>

  <!-- Website team -->
  <rect x="24" y="160" width="330" height="376" rx="12" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="44" y="192" font-size="18" font-weight="700" fill="#0969da">Website team</text>
  <text x="44" y="212" font-size="12.5" fill="#57606a">runner on :3071 · visitTo: insights</text>

  <rect x="44" y="230" width="290" height="62" rx="8" fill="#ffffff" stroke="#54aeff"/>
  <text x="60" y="255" font-size="14" font-weight="600" fill="#1f2328">Wren · front-end developer</text>
  <text x="60" y="276" font-size="12.5" fill="#57606a">has the pricing-page ticket</text>

  <rect x="44" y="310" width="290" height="62" rx="8" fill="#ffffff" stroke="#54aeff"/>
  <text x="60" y="335" font-size="14" font-weight="600" fill="#1f2328">Ticket: Pricing page</text>
  <text x="60" y="356" font-size="12.5" fill="#57606a">three most popular plans, real figures</text>

  <rect x="44" y="390" width="290" height="128" rx="8" fill="#ffffff" stroke="#8c959f" stroke-dasharray="5 4"/>
  <text x="60" y="414" font-size="13.5" font-weight="600" fill="#1f2328">Wren's place, kept at home</text>
  <text x="60" y="438" font-size="12.5" fill="#57606a">• logins and credentials</text>
  <text x="60" y="458" font-size="12.5" fill="#57606a">• conversations and scheduled actions</text>
  <text x="60" y="478" font-size="12.5" fill="#57606a">• other tickets</text>
  <text x="60" y="502" font-size="12.5" fill="#57606a">restored when Wren comes back</text>

  <!-- Insights team -->
  <rect x="606" y="160" width="330" height="376" rx="12" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="626" y="192" font-size="18" font-weight="700" fill="#9a6700">Insights team</text>
  <text x="626" y="212" font-size="12.5" fill="#57606a">runner on :3072 · hostFrom: website</text>

  <rect x="626" y="230" width="290" height="62" rx="8" fill="#ffffff" stroke="#d4a72c"/>
  <text x="642" y="255" font-size="14" font-weight="600" fill="#1f2328">Wren, visiting</text>
  <text x="642" y="276" font-size="12.5" fill="#57606a">gets a ticket of its own here</text>

  <rect x="626" y="320" width="290" height="62" rx="8" fill="#ffffff" stroke="#d4a72c"/>
  <text x="642" y="345" font-size="14" font-weight="600" fill="#1f2328">sales-2026-q3.csv</text>
  <text x="642" y="366" font-size="12.5" fill="#57606a">200 sales · never leaves this team</text>

  <rect x="626" y="400" width="290" height="62" rx="8" fill="#ffffff" stroke="#d4a72c"/>
  <text x="642" y="425" font-size="14" font-weight="600" fill="#1f2328">An Insights admin</text>
  <text x="642" y="446" font-size="12.5" fill="#57606a">approves, refuses or ends the visit</text>

  <text x="642" y="496" font-size="12.5" fill="#57606a">memoryHome: summary, so only</text>
  <text x="642" y="514" font-size="12.5" fill="#57606a">the result goes home</text>

  <!-- 1. request -->
  <path d="M290 158 L 372 110" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="331" cy="134" r="12" fill="#57606a"/><text x="331" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
  <text x="196" y="132" font-size="12.5" fill="#1f2328">request_visit</text>

  <!-- 2. approve -->
  <path d="M670 158 L 588 110" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="629" cy="134" r="12" fill="#57606a"/><text x="629" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
  <text x="650" y="132" font-size="12.5" fill="#1f2328">an admin approves</text>

  <!-- 3. travel pack out -->
  <path d="M336 261 L 622 261" fill="none" stroke="#0969da" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <circle cx="480" cy="261" r="12" fill="#0969da"/><text x="480" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
  <text x="480" y="243" text-anchor="middle" font-size="12.5" fill="#0969da">travel pack: settings + memory</text>
  <text x="480" y="285" text-anchor="middle" font-size="12.5" fill="#0969da">no logins, no conversations</text>

  <!-- 4. work -->
  <path d="M771 318 L 771 294" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="796" cy="306" r="11" fill="#57606a"/><text x="796" y="311" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
  <text x="814" y="310" font-size="12.5" fill="#1f2328">reads, works it out</text>

  <!-- 5. result home -->
  <path d="M604 341 L 338 341" fill="none" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <circle cx="480" cy="341" r="12" fill="#1a7f37"/><text x="480" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text>
  <text x="480" y="323" text-anchor="middle" font-size="12.5" fill="#1a7f37">finish_visit: the result,</text>
  <text x="480" y="365" text-anchor="middle" font-size="12.5" fill="#1a7f37">not the data, onto the ticket</text>
</svg>
